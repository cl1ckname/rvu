[package]
name = "rvu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
git2 = { version = "0.21.0", default-features = false }
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "system-proxy", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
syntect = "5.3.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = "0.5.2"
unicode-width = "0.2"
url = "2.5.8"

# Optimize dependencies (syntect, git2, ...) even in dev builds:
# our code compiles fast, deps run at release speed.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"
